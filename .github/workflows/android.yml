name: Android CI

on:
  push:
    branches:
      - main
    # A pushed tag (v1.0.0…) also publishes a GitHub Release with both APKs.
    # Path filters are not evaluated for tag pushes.
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already provides Android command-line tools. Do not invoke
      # setup-android@v3: it tries to install the obsolete SDK package "tools".
      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $ANDROID_HOME"; exit 1; }
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: JVM unit tests - standard and guard
        run: bash ./gradlew --no-daemon :app:testStandardDebugUnitTest :app:testGuardDebugUnitTest --stacktrace

      - name: Build both release APK flavors
        run: bash ./gradlew --no-daemon :app:assembleStandardRelease :app:assembleGuardRelease --stacktrace

      - name: Android lint
        run: bash ./gradlew --no-daemon :app:lintStandardRelease --stacktrace

      - name: Upload test reports and built APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-results
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-*
            app/build/outputs/apk/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish a GitHub Release with both APKs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/standard/release/app-standard-release.apk release/canvasOS.apk
          cp app/build/outputs/apk/guard/release/app-guard-release.apk release/canvasOS-guard.apk
          gh release create "$GITHUB_REF_NAME" release/canvasOS.apk release/canvasOS-guard.apk \
            --title "canvasOS $GITHUB_REF_NAME" \
            --notes "canvasOS.apk : version standard. canvasOS-guard.apk : version pour TCL (voir AGENTS.md). Signée avec la clé debug du runner : désinstaller la version précédente avant d'installer celle-ci."
